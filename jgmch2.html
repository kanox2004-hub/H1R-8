<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MED-CONFESSIONS | Jalpaiguri Medical College Portal</title>
    <!-- Keep existing CSS styles -->
</head>
<body oncontextmenu="return false;">
    <!-- Keep existing HTML Structure intact -->

    <script>
        let currentUsername = localStorage.getItem('currentUser') || 'Anonymous User';
        let userAge = localStorage.getItem('userAge') || '20';
        let isAdmin = false;
        let activeGroup = 'General Campus';
        let activeIgUser = null;
        let activeDatingPartner = null;

        function checkIfBanned() {
            let bannedUsers = JSON.parse(localStorage.getItem('bannedUsers') || '[]');
            if (bannedUsers.includes(currentUsername)) {
                alert("🚨 Your account has been permanently banned by the Admin!");
                localStorage.removeItem('currentUser');
                window.location.href = 'index.html';
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            checkIfBanned();
            const gender = localStorage.getItem('userGender') || 'Girl';
            const badge = document.getElementById('userInfo');
            if (badge) badge.innerText = `${gender === 'Boy' ? '👦' : '👧'} ${currentUsername} (Age: ${userAge})`;
            
            if(document.getElementById('profileAgeInput')) document.getElementById('profileAgeInput').value = userAge;
            if(document.getElementById('myAgeInput')) document.getElementById('myAgeInput').value = userAge;

            setupAntiScreenshot();
            loadAllData();

            setInterval(() => {
                loadAllData();
            }, 2000);
        });

        // Rest of functions remain intact
    </script>
</body>
</html>
